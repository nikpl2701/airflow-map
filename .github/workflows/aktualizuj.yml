# Automatyczna aktualizacja mapy: pobiera prognozy, liczy i publikuje na GitHub Pages.
# Dwa niezależne przebiegi: "krotki" (0-72h, GFS+ICON-EU, 4x/dobę) i "dlugi"
# (0-168h, tylko GFS, 2x/dobę — dłuższy zakres nie musi się liczyć częściej).
name: Aktualizuj mape

on:
  schedule:
    # godziny w UTC; ok. 5 h po starcie przebiegów modeli, gdy dane są już opublikowane
    - cron: "30 5,11,17,23 * * *"   # krotki, 4x/dobę
    - cron: "45 6,18 * * *"          # dlugi, 2x/dobę
  workflow_dispatch:
    inputs:
      profil:
        description: "Który przebieg policzyć"
        type: choice
        options: ["oba", "krotki", "dlugi"]
        default: "oba"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalacja bibliotek
        run: pip install -r requirements.txt

      - name: Ustal ktory przebieg liczymy
        id: wybor
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profil=${{ inputs.profil }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5,11,17,23 * * *" ]; then
            echo "profil=krotki" >> "$GITHUB_OUTPUT"
          else
            echo "profil=dlugi" >> "$GITHUB_OUTPUT"
          fi

      - name: Policz krotki (0-72h, GFS + ICON-EU)
        if: steps.wybor.outputs.profil == 'krotki' || steps.wybor.outputs.profil == 'oba'
        run: python run.py --profil krotki --bez-png

      - name: Policz dlugi (0-168h, tylko GFS)
        if: steps.wybor.outputs.profil == 'dlugi' || steps.wybor.outputs.profil == 'oba'
        run: python run.py --profil dlugi --bez-png

      - name: Zachowaj dane profilu, ktory dzis nie byl liczony
        run: |
          NAZWA_REPO="${GITHUB_REPOSITORY#*/}"
          python zachowaj_stare_dane.py --strona "https://${{ github.repository_owner }}.github.io/${NAZWA_REPO}"

      - name: Przygotowanie strony
        run: |
          mkdir -p _site
          cp -r render/web/* _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
