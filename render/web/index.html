<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>airflow-map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body, #map { height: 100%; margin: 0; background: #000; }
  body { font: 13px/1.4 system-ui, sans-serif; color: #e8e8e8; }
  .box {
    position: absolute; background: rgba(8, 12, 24, .82);
    border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
    padding: 10px 12px; backdrop-filter: blur(4px);
  }
  #info { left: 12px; top: 12px; max-width: 290px; }
  #info h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  #info .row { display: flex; gap: 6px; }
  #info .k { color: #9aa3b2; min-width: 92px; }
  #legenda { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.12); }
  #legenda div { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .kreska { width: 26px; height: 3px; border-radius: 2px; }
  .litera { width: 26px; text-align: center; font-weight: 700; font-size: 15px; }

  #wybor { display: flex; flex-direction: column; gap: 5px; margin: 0 0 8px; }
  .segment { display: flex; gap: 4px; }
  .segment button {
    flex: 1; background: rgba(255,255,255,.06); color: #ccc; border: 1px solid rgba(255,255,255,.14);
    border-radius: 6px; padding: 5px 6px; font-size: 11.5px; cursor: pointer; white-space: nowrap;
  }
  .segment button.aktywny { background: #e74c3c; border-color: #e74c3c; color: #fff; }
  .segment button:disabled { opacity: .32; cursor: not-allowed; }
  .segment button:not(.aktywny):not(:disabled):hover { background: rgba(255,255,255,.14); }

  #czas { left: 12px; right: 12px; bottom: 20px; }
  #czas-gora { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  #teraz { font-size: 20px; font-weight: 600; color: #fff; }
  #wzgl { color: #9aa3b2; }
  #suwak-row { display: flex; align-items: center; gap: 10px; }
  #play {
    background: #26324a; color: #fff; border: 0; border-radius: 6px;
    width: 34px; height: 30px; font-size: 14px; cursor: pointer; flex: none;
  }
  #play:hover { background: #34436a; }
  #slider { flex: 1; accent-color: #e74c3c; }
  #dni { position: relative; height: 16px; margin: 2px 0 0 44px; color: #9aa3b2; font-size: 11px; }
  #dni span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  #dni span::before { content: ""; position: absolute; left: 50%; top: -5px; height: 4px; border-left: 1px solid #667; }

  /* prognoza punktowa (prawa strona) */
  #punkt { right: 12px; top: 12px; width: 390px; max-height: calc(100% - 150px); display: flex; flex-direction: column; }
  #punkt[hidden] { display: none; }
  #punkt h2 { font-size: 14px; margin: 0; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #punkt h2 small { font-weight: 400; color: #9aa3b2; font-size: 11px; }
  #p-teraz { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 8px 0; }
  .kafel { background: rgba(255,255,255,.05); border-radius: 6px; padding: 6px 8px; }
  .kafel .e { color: #9aa3b2; font-size: 11px; }
  .kafel .w { font-size: 17px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
  .kafel .w small { font-size: 11px; font-weight: 400; color: #9aa3b2; }
  #p-tab-wrap { overflow-y: auto; min-height: 0; border-top: 1px solid rgba(255,255,255,.12); }
  #p-tab { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  #p-tab th { position: sticky; top: 0; background: #0b1020; color: #9aa3b2; font-weight: 500; text-align: right; padding: 4px 4px; }
  #p-tab th:first-child, #p-tab td:first-child { text-align: left; }
  #p-tab td { text-align: right; padding: 3px 4px; border-top: 1px solid rgba(255,255,255,.05); white-space: nowrap; }
  #p-tab tr { cursor: pointer; }
  #p-tab tbody tr:hover { background: rgba(255,255,255,.06); }
  #p-tab tr.akt { background: rgba(231,76,60,.28); }
  #p-tab tr.noc td:first-child { color: #9aa3b2; }
  .deszcz { color: #5dade2; }
  .strz { display: inline-block; }
  #p-zwin { background: none; border: 0; color: #9aa3b2; cursor: pointer; font-size: 12px; padding: 0; }
  #punkt.zwiniety #p-tab-wrap { display: none; }
  @media (max-width: 760px) {
    #punkt { left: 12px; right: 12px; width: auto; top: auto; bottom: 150px; max-height: 40%; }
    .kafel .w { font-size: 15px; }
    #info { display: none; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="info" class="box">
  <h1>Przepływ powietrza na 850 hPa</h1>
  <div id="wybor">
    <div class="segment" id="sel-zakres">
      <button data-val="krotki" class="aktywny">3 dni</button>
      <button data-val="dlugi">7 dni</button>
    </div>
    <div class="segment" id="sel-model">
      <button data-val="zgodnosc" class="aktywny">Zgodność</button>
      <button data-val="gfs">GFS</button>
      <button data-val="icon_eu">ICON-EU</button>
    </div>
  </div>
  <div class="row"><span class="k">Widok</span><span id="i-warstwa">—</span></div>
  <div class="row"><span class="k">Start prognozy</span><span id="i-przebieg">—</span></div>
  <div class="row"><span class="k">Policzono</span><span id="i-obliczono">—</span></div>
  <div class="row"><span class="k">Modele</span><span id="i-modele">—</span></div>
  <div class="row"><span class="k">Kroki</span><span id="i-kroki">—</span></div>
  <div id="legenda">
    <div><span class="kreska" style="background:#e74c3c"></span>napływ ciepłego powietrza</div>
    <div><span class="kreska" style="background:#3498db"></span>napływ zimnego powietrza</div>
    <div id="legenda-zgodnosc"><span class="kreska" style="background:#aaa;opacity:.45"></span>bladsza linia = modele się nie zgadzają</div>
    <div><span class="litera" style="color:#3498db">N</span>niż</div>
    <div><span class="litera" style="color:#e74c3c">W</span>wyż</div>
  </div>
</div>

<div id="punkt" class="box" hidden>
  <h2><span id="p-nazwa">Łomża</span> <small id="p-model"></small>
    <button id="p-zwin" title="Zwiń / rozwiń tabelę">tabela ▾</button></h2>
  <div id="p-teraz"></div>
  <div id="p-tab-wrap">
    <table id="p-tab">
      <thead><tr>
        <th>czas</th><th title="temperatura">°C</th><th title="temperatura odczuwalna">odcz.</th>
        <th title="opad w kroku (3 h)">opad</th><th title="opad od startu prognozy">Σ opad</th>
        <th title="ciśnienie na poziomie morza">hPa</th><th title="wiatr / porywy">wiatr m/s</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="czas" class="box">
  <div id="czas-gora">
    <span id="teraz">Wczytywanie…</span>
    <span id="wzgl"></span>
  </div>
  <div id="suwak-row">
    <button id="play" title="Odtwarzaj / pauza">▶</button>
    <input id="slider" type="range" min="0" max="0" value="0" step="1">
  </div>
  <div id="dni"></div>
</div>

<script>
const STREFA = 'Europe/Warsaw';
const fmtDzien = new Intl.DateTimeFormat('pl-PL', { timeZone: STREFA, weekday: 'short', day: '2-digit', month: '2-digit' });
const fmtGodz = new Intl.DateTimeFormat('pl-PL', { timeZone: STREFA, hour: '2-digit', minute: '2-digit' });
const fmtUTC = new Intl.DateTimeFormat('pl-PL', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit' });
const NAZWY_MODELI = { gfs: 'GFS', icon_eu: 'ICON-EU', ecmwf: 'ECMWF' };
const NAZWY_WARSTW = { zgodnosc: 'Zgodność modeli', gfs: 'Tylko GFS', icon_eu: 'Tylko ICON-EU' };

const pelna = d => `${fmtDzien.format(d)}, ${fmtGodz.format(d)}`;

let META = {};         // cache: { krotki: {...}, dlugi: {...} } z data/meta_<profil>.json
let KROKI = [];
let PROFIL = 'krotki';
let MODEL = 'zgodnosc';

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://demotiles.maplibre.org/style.json',
  center: [15, 50],
  zoom: 2.2,
});

map.on('style.load', () => map.setProjection({ type: 'globe' }));

const stepUrl = h => `data/${PROFIL}/${MODEL}/step_${String(h).padStart(3, '0')}.geojson`;

async function loadJSON(url) {
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) throw new Error('brak pliku ' + url);
  return resp.json();
}

async function wczytajMeta(profil) {
  if (!META[profil]) META[profil] = await loadJSON(`data/meta_${profil}.json`);
  return META[profil];
}

function dostepnyModel(model, m) {
  return model === 'zgodnosc' ? !!m.ma_zgodnosc : (m.modele || []).includes(model);
}

function odswiezAktywne(selektor, wartosc) {
  document.querySelectorAll(`${selektor} button`).forEach(b => b.classList.toggle('aktywny', b.dataset.val === wartosc));
}

// strzałka (grot) rysowana na płótnie — kolor nadaje warstwa (SDF)
function obrazekStrzalki() {
  const s = 32, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.beginPath();
  g.moveTo(s * 0.85, s / 2);
  g.lineTo(s * 0.2, s * 0.15);
  g.lineTo(s * 0.38, s / 2);
  g.lineTo(s * 0.2, s * 0.85);
  g.closePath();
  g.fill();
  return g.getImageData(0, 0, s, s);
}

function pokazInfo() {
  const m = META[PROFIL];
  if (!m) return;
  document.getElementById('i-warstwa').textContent = NAZWY_WARSTW[MODEL] || MODEL;
  document.getElementById('legenda-zgodnosc').style.display = MODEL === 'zgodnosc' ? '' : 'none';
  const start = new Date(m.przebieg_iso);
  document.getElementById('i-przebieg').textContent = `${pelna(start)} (${fmtUTC.format(start)} UTC)`;
  document.getElementById('i-obliczono').textContent = pelna(new Date(m.obliczono_iso));
  document.getElementById('i-modele').textContent =
    (m.modele || []).map(x => NAZWY_MODELI[x] || x).join(', ');
  const k = m.kroki;
  document.getElementById('i-kroki').textContent =
    k.length > 1 ? `${k.length} × co ${k[1] - k[0]} h (do +${k[k.length - 1]} h)` : `${k.length}`;
}

function pokazCzas(h) {
  const teraz = document.getElementById('teraz');
  const wzgl = document.getElementById('wzgl');
  const m = META[PROFIL];
  if (!m) { teraz.textContent = `+${h} h`; wzgl.textContent = ''; return; }
  const start = new Date(m.przebieg_iso);
  const t = new Date(start.getTime() + h * 3600e3);
  teraz.textContent = pelna(t);
  const dni = Math.floor(h / 24), godz = h % 24;
  const opis = h === 0 ? 'analiza (start prognozy)'
    : `+${h} h od startu prognozy` + (dni ? ` (${dni} d ${godz} h)` : '');
  const doTeraz = (t - Date.now()) / 3600e3;
  const wzglTeraz = Math.abs(doTeraz) < 1.5 ? ' · to jest teraz'
    : doTeraz < 0 ? ` · ${Math.round(-doTeraz)} h temu` : ` · za ${Math.round(doTeraz)} h`;
  wzgl.textContent = opis + wzglTeraz;
}

// kreski z datami pod suwakiem (każda północ czasu polskiego)
function rysujDni() {
  const el = document.getElementById('dni');
  el.innerHTML = '';
  const m = META[PROFIL];
  if (!m || KROKI.length < 2) return;
  const start = new Date(m.przebieg_iso).getTime();
  const h0 = KROKI[0], h1 = KROKI[KROKI.length - 1];
  const slider = document.getElementById('slider');
  el.style.width = slider.offsetWidth + 'px';
  for (let h = h0; h <= h1; h++) {
    const t = new Date(start + h * 3600e3);
    if (fmtGodz.format(t) !== '00:00') continue;
    const i = KROKI.findIndex(k => k >= h);
    const x = (i / (KROKI.length - 1)) * 100;
    const s = document.createElement('span');
    s.style.left = x + '%';
    s.textContent = fmtDzien.format(t);
    el.appendChild(s);
  }
}

// ---------- prognoza punktowa (tabela po prawej) ----------
let PUNKT = null;      // pełne dane z punkt.json (wszystkie godziny, niezależnie od profilu)
let PUNKT_KLIK = () => {};
const fmtKrotki = new Intl.DateTimeFormat('pl-PL', { timeZone: STREFA, weekday: 'short', day: 'numeric' });
const KIERUNKI =['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const fmt = (v, n = 1) => (v === null || v === undefined) ? '—' : Number(v).toFixed(n).replace('.', ',');
const kierunek = st => st === null || st === undefined ? '' : KIERUNKI[Math.round(st / 45) % 8];
// strzałka "dokąd wieje" (kierunek meteorologiczny mówi skąd, więc +180°)
const strzWiatru = st => st === null || st === undefined ? ''
  : `<span class="strz" style="transform:rotate(${(st + 180) % 360}deg)" title="wiatr z ${kierunek(st)}">↑</span>`;

async function wczytajPunkt() {
  try {
    PUNKT = await loadJSON('data/punkt.json');
  } catch (e) {
    return;   // brak pliku — panel zostaje ukryty
  }
  document.getElementById('punkt').hidden = false;
  document.getElementById('p-nazwa').textContent = PUNKT.nazwa;
  document.getElementById('p-model').textContent =
    `${NAZWY_MODELI[PUNKT.model] || PUNKT.model} · ${PUNKT.zrodlo}`;
  if (DOM_MARKER) DOM_MARKER.setLngLat([PUNKT.lon, PUNKT.lat]).getPopup().setText(PUNKT.nazwa);
  zbudujTabelePunktu();
  document.getElementById('p-zwin').addEventListener('click', () =>
    document.getElementById('punkt').classList.toggle('zwiniety'));
}

// odbudowuje wiersze tabeli dla aktualnego KROKI (zależy od wybranego zakresu/profilu)
function zbudujTabelePunktu() {
  if (!PUNKT) return;
  const wiersze = PUNKT.kroki.filter(k => KROKI.includes(k.h));
  const tb = document.querySelector('#p-tab tbody');
  tb.innerHTML = '';
  let poprzDzien = '';
  wiersze.forEach(k => {
    const t = new Date(k.czas_iso);
    const g = fmtGodz.format(t);
    const dz = fmtKrotki.format(t).replace('.', '').replace(',', '');
    const godz = Number(g.slice(0, 2));
    const tr = document.createElement('tr');
    tr.dataset.h = k.h;
    if (godz < 6 || godz >= 21) tr.className = 'noc';
    tr.innerHTML =
      `<td>${dz !== poprzDzien ? dz + ' ' : ''}${g}</td>` +
      `<td>${fmt(k.temp)}</td><td>${fmt(k.odczuwalna)}</td>` +
      `<td class="${k.opad > 0 ? 'deszcz' : ''}">${k.opad > 0 ? fmt(k.opad) : '·'}</td>` +
      `<td class="${k.opad_suma > 0 ? 'deszcz' : ''}">${fmt(k.opad_suma)}</td>` +
      `<td>${fmt(k.cisnienie, 0)}</td>` +
      `<td>${strzWiatru(k.kierunek)} ${fmt(k.wiatr)}/${fmt(k.porywy, 0)}</td>`;
    tr.addEventListener('click', () => {
      const i = KROKI.indexOf(k.h);
      if (i >= 0) PUNKT_KLIK(i);
    });
    tb.appendChild(tr);
    poprzDzien = dz;
  });
}

function pokazPunkt(h) {
  if (!PUNKT) return;
  const k = PUNKT.kroki.find(x => x.h === h);
  const el = document.getElementById('p-teraz');
  if (!k) { el.innerHTML = '<div class="kafel">brak danych dla tego kroku</div>'; return; }
  el.innerHTML =
    `<div class="kafel"><div class="e">temperatura</div><div class="w">${fmt(k.temp)}<small> °C</small></div></div>` +
    `<div class="kafel"><div class="e">odczuwalna</div><div class="w">${fmt(k.odczuwalna)}<small> °C</small></div></div>` +
    `<div class="kafel"><div class="e">ciśnienie</div><div class="w">${fmt(k.cisnienie, 0)}<small> hPa</small></div></div>` +
    `<div class="kafel"><div class="e">opad (3 h)</div><div class="w">${fmt(k.opad)}<small> mm</small></div></div>` +
    `<div class="kafel"><div class="e">opad od startu</div><div class="w">${fmt(k.opad_suma)}<small> mm</small></div></div>` +
    `<div class="kafel"><div class="e">wiatr ${kierunek(k.kierunek)} ${strzWiatru(k.kierunek)}</div><div class="w">${fmt(k.wiatr)}<small> m/s</small></div><div class="e">porywy ${fmt(k.porywy, 0)} m/s</div></div>`;
  document.querySelectorAll('#p-tab tbody tr').forEach(tr => {
    const akt = Number(tr.dataset.h) === h;
    tr.classList.toggle('akt', akt);
    if (akt) tr.scrollIntoView({ block: 'nearest' });
  });
}

// ---------- przełączanie zakresu (3 dni / 7 dni) i warstwy (Zgodność / GFS / ICON-EU) ----------
async function ustawProfil(profil, zachowajKrok = false) {
  const slider = document.getElementById('slider');
  const poprzedniH = (zachowajKrok && KROKI.length) ? KROKI[Number(slider.value)] : null;

  let m;
  try {
    m = await wczytajMeta(profil);
  } catch (e) {
    document.getElementById('wzgl').textContent = ` · brak danych dla zakresu „${profil}” (jeszcze nie policzone)`;
    return;
  }
  PROFIL = profil;
  KROKI = m.kroki;

  document.querySelectorAll('#sel-model button').forEach(b => { b.disabled = !dostepnyModel(b.dataset.val, m); });
  if (!dostepnyModel(MODEL, m)) MODEL = m.ma_zgodnosc ? 'zgodnosc' : m.modele[0];

  odswiezAktywne('#sel-zakres', PROFIL);
  odswiezAktywne('#sel-model', MODEL);

  slider.max = String(KROKI.length - 1);
  let i = 0;
  if (poprzedniH !== null) {
    i = KROKI.reduce((best, h, idx) => Math.abs(h - poprzedniH) < Math.abs(KROKI[best] - poprzedniH) ? idx : best, 0);
  }
  slider.value = String(i);

  pokazInfo();
  rysujDni();
  zbudujTabelePunktu();
  await ustaw(i);
}

async function ustawModel(model) {
  const m = META[PROFIL];
  if (!m || !dostepnyModel(model, m)) return;
  MODEL = model;
  odswiezAktywne('#sel-model', MODEL);
  pokazInfo();
  await ustaw(Number(document.getElementById('slider').value));
}

let wczytywany = 0;
async function ustaw(i) {
  const h = KROKI[i];
  pokazCzas(h);
  pokazPunkt(h);
  const nr = ++wczytywany;
  try {
    const dane = await loadJSON(stepUrl(h));
    if (nr === wczytywany) map.getSource('kroki').setData(dane);
  } catch (e) {
    document.getElementById('wzgl').textContent += ' · (brak danych dla tego kroku)';
  }
}

async function start() {
  map.setSky({ 'sky-color': '#000010', 'horizon-color': '#1c1c2e', 'fog-color': '#0b1e3d' });
  map.addImage('strzalka', obrazekStrzalki(), { sdf: true });

  let first;
  try {
    const m = await wczytajMeta('krotki');
    KROKI = m.kroki;
    if (!dostepnyModel(MODEL, m)) MODEL = m.ma_zgodnosc ? 'zgodnosc' : m.modele[0];
    first = await loadJSON(stepUrl(KROKI[0]));
  } catch (e) {
    document.getElementById('teraz').textContent = 'Brak danych — najpierw uruchom uruchom.bat';
    return;
  }
  map.addSource('kroki', { type: 'geojson', data: first });

  const jestLinia = ['has', 'rodzaj'];
  const przezroczystosc = ['case', ['==', ['get', 'pewne'], false], 0.45, 1];

  map.addLayer({
    id: 'izobary', type: 'line', source: 'kroki',
    filter: ['all', ['==', ['geometry-type'], 'LineString'], ['!', jestLinia]],
    paint: { 'line-color': '#888', 'line-width': 0.6, 'line-opacity': 0.6 },
  });
  map.addLayer({
    id: 'linie', type: 'line', source: 'kroki',
    filter: jestLinia,
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': ['get', 'kolor'], 'line-width': 2, 'line-opacity': przezroczystosc },
  });
  map.addLayer({
    id: 'strzalki', type: 'symbol', source: 'kroki',
    filter: jestLinia,
    layout: {
      'symbol-placement': 'line',
      'symbol-spacing': 70,
      'icon-image': 'strzalka',
      'icon-size': 0.55,
      'icon-rotation-alignment': 'map',
      'icon-allow-overlap': true,
      'icon-ignore-placement': true,
    },
    paint: { 'icon-color': ['get', 'kolor'], 'icon-opacity': przezroczystosc },
  });
  map.addLayer({
    id: 'centra', type: 'symbol', source: 'kroki',
    filter: ['==', ['geometry-type'], 'Point'],
    layout: {
      'text-field': ['get', 'typ'],
      'text-size': 20,
      'text-font': ['Open Sans Semibold'],
      'text-allow-overlap': true,
    },
    paint: {
      'text-color': ['match', ['get', 'typ'], 'N', '#3498db', 'W', '#e74c3c', '#fff'],
      'text-halo-color': '#000', 'text-halo-width': 1.5,
    },
  });

  // globus czasem nie rysuje świeżo dodanych warstw — ponowne ustawienie projekcji to wymusza
  map.setProjection({ type: 'globe' });
  map.triggerRepaint();

  await wczytajPunkt();
  PUNKT_KLIK = i => { document.getElementById('slider').value = String(i); ustaw(i); };

  document.querySelectorAll('#sel-zakres button').forEach(b =>
    b.addEventListener('click', () => { if (!b.classList.contains('aktywny')) ustawProfil(b.dataset.val, true); }));
  document.querySelectorAll('#sel-model button').forEach(b =>
    b.addEventListener('click', () => { if (!b.disabled) ustawModel(b.dataset.val); }));

  const slider = document.getElementById('slider');
  slider.addEventListener('input', () => ustaw(Number(slider.value)));
  window.addEventListener('resize', rysujDni);

  await ustawProfil('krotki');   // ustawia info / dni / tabelę punktową i rysuje krok 0

  // odtwarzanie
  const play = document.getElementById('play');
  let timer = null;
  play.addEventListener('click', () => {
    if (timer) { clearInterval(timer); timer = null; play.textContent = '▶'; return; }
    play.textContent = '❚❚';
    timer = setInterval(() => {
      const i = (Number(slider.value) + 1) % KROKI.length;
      slider.value = String(i);
      ustaw(i);
    }, 700);
  });
}

// pinezka: mój dom (ustawiona na centrum miasta — strona jest publiczna)
const DOM = { nazwa: 'Łomża', lon: 22.06, lat: 53.18 };
const DOM_MARKER = new maplibregl.Marker({ color: '#f1c40f', scale: 0.8 })
  .setLngLat([DOM.lon, DOM.lat])
  .setPopup(new maplibregl.Popup({ offset: 24, closeButton: false }).setText(DOM.nazwa))
  .addTo(map);

map.on('load', start);
</script>
</body>
